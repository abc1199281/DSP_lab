name: Python CI

on:
  push:
    branches:
      - dev_python
  pull_request:
    branches:
      - dev_python

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        repository: abc1199281/DSP_lab

    - name: Set up Python 3.x
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy
        pip install scipy
        pip install matplotlib

    - name: Set up PYTHONPATH
      run: |
        echo "PYTHONPATH=$GITHUB_WORKSPACE/DSP_lab" >> $GITHUB_ENV

    - name: Run tests
      run: |
        python Ch4_SamplingOfContinuousSignal/lib/quantizing.py
        python Ch4_SamplingOfContinuousSignal/lib/estimate_snr.py
        python Others/SNR_Estimation/basic_snr_estimate.py
        python Others/SNR_Estimation/estimate_pnr.py
        python Others/CRLB/FrequencyEstimation/crlb_freq_estimation.py
        python Others/LMS/lib/lms1.py
        python Others/LMS/lib/nlms.py
        python Others/LMS/lib/lms_leaky_lms.py
        # Add more test files here in the future
